specVersion: "4.0"
metadata:
  name: com.csr.flp.ext
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ushell
    - name: sap.collaboration
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://appsapfioride.ap1.hana.ondemand.com:44303
            destination: CSR_ECC
          - path: /sap/fiori/csrflpextension/sap/opu/odata
            destination: CSR_ECC
            url: http://appsapfioride.ap1.hana.ondemand.com:44303
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.csr.flp.ext
        ui5Theme: sap_fiori_3
